<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XTU-Connect 控制面板</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 40px 16px; background: #0f1420; color: #e6e9f0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .card {
    width: 100%; max-width: 560px; background: #171e2e; border: 1px solid #263046;
    border-radius: 14px; padding: 24px 28px; box-shadow: 0 8px 40px rgba(0,0,0,.35);
  }
  h1 { font-size: 20px; margin: 0 0 18px; display: flex; align-items: center; gap: 10px; }
  h1 .logo { width: 22px; height: 22px; border-radius: 6px; background: #1e5ac8;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 13px; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 16px; margin-bottom: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #7a8194; flex: none; }
  .dot.running { background: #2ecc71; box-shadow: 0 0 8px #2ecc7188; }
  .dot.starting { background: #f1c40f; box-shadow: 0 0 8px #f1c40f88; }
  .dot.error { background: #e74c3c; box-shadow: 0 0 8px #e74c3c88; }
  .detail { color: #8b93a7; font-size: 13px; line-height: 1.7; min-height: 22px;
    margin-bottom: 18px; white-space: pre-line; word-break: break-all; }
  .btns { display: flex; gap: 10px; margin-bottom: 20px; }
  button {
    flex: 1; padding: 10px 0; border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
    background: #1e5ac8; color: #fff; transition: filter .15s;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { background: #2a3348; color: #5b6478; cursor: not-allowed; }
  button.ghost { background: #263046; color: #c6cddd; }
  details { border-top: 1px solid #263046; padding: 12px 0 4px; }
  summary { cursor: pointer; font-size: 14px; color: #aeb6c8; user-select: none; }
  form { display: flex; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
  input {
    flex: 1; min-width: 120px; padding: 9px 12px; border-radius: 8px; border: 1px solid #323d55;
    background: #0f1420; color: #e6e9f0; font-size: 14px;
  }
  input:focus { outline: none; border-color: #1e5ac8; }
  form button { flex: none; padding: 9px 16px; }
  .hint { color: #5b6478; font-size: 12px; margin: 6px 0 8px; }
  .acct-list { margin: 10px 0 2px; }
  .acct-row {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border: 1px solid #263046; border-radius: 8px; margin-bottom: 6px; font-size: 13px;
  }
  .acct-row .name { flex: 1; word-break: break-all; color: #c6cddd; }
  .acct-row .cur { color: #2ecc71; }
  .acct-row button { flex: none; padding: 5px 12px; font-size: 12px; border-radius: 6px; }
  .acct-row button.del { background: #263046; color: #c6cddd; }
  pre {
    background: #0b0f18; border: 1px solid #263046; border-radius: 8px; padding: 12px;
    font-size: 12px; line-height: 1.55; max-height: 260px; overflow: auto; color: #9aa3b8;
    white-space: pre-wrap; word-break: break-all; margin: 10px 0 6px;
  }
  .msg { font-size: 13px; margin: 8px 0; min-height: 18px; }
  .msg.ok { color: #2ecc71; } .msg.err { color: #e74c3c; }
</style>
</head>
<body>
<div class="card">
  <h1><span class="logo">X</span>XTU-Connect <span style="font-size:12px;color:#5b6478;font-weight:400">湘潭大学校园网</span></h1>

  <div class="status"><span class="dot" id="dot"></span><span id="state">加载中…</span></div>
  <div class="detail" id="detail"></div>

  <div class="btns">
    <button id="btnStart">连接</button>
    <button id="btnStop" class="ghost">断开</button>
    <button id="btnRestart" class="ghost">重连</button>
  </div>

  <details id="credSection">
    <summary>账号设置</summary>
    <div id="accountList" class="acct-list"></div>
    <form id="credForm">
      <input id="username" placeholder="学号/工号" autocomplete="off">
      <input id="password" type="password" placeholder="密码" autocomplete="new-password">
      <button type="submit">保存并连接</button>
    </form>
    <p class="hint">账号保存在本机 ~/.config/xtu-connect/（权限 600），密码经 AES-GCM 加密后存入账号簿，可直接切换多个账号</p>
    <div class="msg" id="credMsg"></div>
  </details>

  <details>
    <summary>运行日志</summary>
    <pre id="log">（暂无日志）</pre>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
let curState = '';

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}

function fmtDuration(sec) {
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = Math.floor(sec%60);
  return h ? `${h}小时${m}分` : m ? `${m}分${s}秒` : `${s}秒`;
}

async function refresh() {
  try {
    const st = await api('/api/status');
    curState = st.state;
    $('dot').className = 'dot ' + st.state;
    $('state').textContent = st.state_text + (st.state==='running' && st.started_at ? `（已运行 ${fmtDuration(Date.now()/1000 - st.started_at)}）` : '');
    const lines = [];
    if (st.username) lines.push('当前账号：' + st.username);
    lines.push('分流模式：系统代理（浏览器自动 PAC 分流，SSH 由程序自动配置）');
    if (st.client_ip) lines.push(`内网 IP：${st.client_ip}`);
    if (st.socks_addr) lines.push(`SOCKS5 代理：${st.socks_addr}　HTTP 代理：127.0.0.1:1081`);
    if (st.system_proxy === 'on') {
      let t = '浏览器分流：已启用 —— 校内网走本程序，其余流量直连（Clash TUN 可照常接管）';
      if (st.system_proxy_chain) t = '浏览器分流：已启用（链式接管）—— 校内网走本程序，其余流量继续走原系统代理 ' + st.system_proxy_chain;
      lines.push(t);
    }
    else if (st.system_proxy === 'conflict') lines.push('浏览器分流：未启用（' + (st.system_proxy_err || '系统代理被其他程序占用') + '）');
    else if (st.system_proxy === 'unsupported') lines.push('浏览器分流：当前平台请手动将代理设为 127.0.0.1:1080');
    if (st.ssh_rule === 'on') lines.push('SSH 分流：~/.ssh/config 内网规则已自动写入（断开自动移除）');
    else if (st.ssh_rule === 'unsupported') lines.push('SSH 分流：当前平台不支持自动写入，请手动配置 ProxyCommand');
    if (st.last_error) lines.push(`错误：${st.last_error}`);
    if (!lines.length && !st.has_credentials) lines.push('尚未配置凭据，请展开「账号设置」填写学号密码');
    if (!lines.length && st.cli_binary === '') lines.push('未找到 xtu-connect 主程序，请将它与本程序放在同一目录');
    $('detail').textContent = lines.join('\n');

    const busy = st.state==='starting';
    $('btnStart').disabled = busy || st.state==='running' || !st.has_credentials;
    $('btnStop').disabled = !(st.state==='running' || st.state==='starting');
    $('btnRestart').disabled = !st.has_credentials;
    // 账号设置仅断开时可见（连接中/启动中隐藏，避免误改正在使用的凭据）
    $('credSection').style.display = (st.state==='running' || st.state==='starting') ? 'none' : '';
    renderAccounts(st);
  } catch (e) { $('state').textContent = '面板服务不可达'; }
}

function renderAccounts(st) {
  const box = $('accountList');
  box.innerHTML = '';
  const list = st.accounts || [];
  if (!list.length) return;
  const label = document.createElement('div');
  label.className = 'hint';
  label.textContent = '已保存的账号（密码已加密存储）：';
  box.appendChild(label);
  list.forEach(u => {
    const row = document.createElement('div');
    row.className = 'acct-row';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = u;
    if (u === st.username) {
      const tag = document.createElement('span');
      tag.className = 'cur';
      tag.textContent = ' · 当前';
      name.appendChild(tag);
    }
    const btnSwitch = document.createElement('button');
    btnSwitch.textContent = u === st.username ? '重连' : '切换';
    btnSwitch.onclick = async () => {
      btnSwitch.disabled = true;
      const r = await api('/api/accounts/switch', {username: u});
      if (r.error) { alert(r.error); btnSwitch.disabled = false; }
      refresh();
    };
    const btnDel = document.createElement('button');
    btnDel.className = 'del';
    btnDel.textContent = '删除';
    btnDel.onclick = async () => {
      if (!confirm('确定删除账号 ' + u + ' 的保存记录？')) return;
      const r = await api('/api/accounts/delete', {username: u});
      if (r.error) alert(r.error);
      refresh();
    };
    row.append(name, btnSwitch, btnDel);
    box.appendChild(row);
  });
}

$('btnStart').onclick = async () => { const r = await api('/api/start'); if (r.error) alert(r.error); refresh(); };
$('btnStop').onclick = async () => { await api('/api/stop'); refresh(); };
$('btnRestart').onclick = async () => { await api('/api/restart'); refresh(); };

$('credForm').onsubmit = async e => {
  e.preventDefault();
  const msg = $('credMsg');
  msg.className = 'msg'; msg.textContent = '保存中…';
  const r = await api('/api/credentials', {
    username: $('username').value.trim(),
    password: $('password').value,
  });
  if (r.ok === 'true') { msg.className='msg ok'; msg.textContent='已保存，正在连接…'; $('password').value=''; }
  else { msg.className='msg err'; msg.textContent = r.error || '保存失败'; }
  refresh();
};

async function refreshLog() {
  try {
    const r = await api('/api/log');
    if (r.lines && r.lines.length) $('log').textContent = r.lines.join('\n');
  } catch (e) {}
}

refresh(); refreshLog();
setInterval(refresh, 2000);
setInterval(refreshLog, 3000);
</script>
</body>
</html>
